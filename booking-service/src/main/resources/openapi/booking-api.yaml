openapi: 3.0.3

info:
  title: Equipment Rental Booking API
  version: 1.0.0
  description: Minimal REST contract for the booking service POC.

tags:
  - name: Bookings
    description: Booking operations

paths:
  /bookings:
    post:
      tags:
        - Bookings
      operationId: createBooking
      summary: Start the booking creation process
      description: >
        Creates a booking in PENDING status and starts
        the asynchronous CreateBookingSaga.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'

      responses:
        '202':
          description: Booking creation process accepted
          headers:
            Location:
              description: URL of the created booking resource
              required: true
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBookingResponse'

        '400':
          description: Invalid request

  /bookings/{bookingId}:
    get:
      tags:
        - Bookings
      operationId: getBooking
      summary: Get the current booking state

      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
            format: uuid

      responses:
        '200':
          description: Current booking state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'

        '404':
          description: Booking not found

components:
  schemas:
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required:
        - customerId
        - equipmentId
        - quantity
      properties:
        customerId:
          type: string
          minLength: 1
          example: customer-normal
        equipmentId:
          type: string
          minLength: 1
          example: camera
        quantity:
          type: integer
          format: int32
          minimum: 1
          example: 2

    CreateBookingResponse:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - status
      properties:
        bookingId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/BookingStatus'

    BookingResponse:
      type: object
      additionalProperties: false
      required:
        - bookingId
        - customerId
        - equipmentId
        - quantity
        - status
      properties:
        bookingId:
          type: string
          format: uuid
        customerId:
          type: string
        equipmentId:
          type: string
        quantity:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/BookingStatus'
        rejectionReason:
          $ref: '#/components/schemas/BookingRejectionReason'

    BookingStatus:
      type: string
      enum:
        - PENDING
        - CONFIRMED
        - REJECTED

    BookingRejectionReason:
      type: string
      enum:
        - UNKNOWN_EQUIPMENT
        - INSUFFICIENT_STOCK
        - HOLD_CONFLICT
        - CUSTOMER_LIMIT_EXCEEDED